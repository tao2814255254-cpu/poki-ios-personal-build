name: Poki cellular cold-start repair
on:
  push:
    branches: [cellular-fix-20261111]
    paths: ['.github/workflows/build.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unsigned-iphone-app:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          repository: JosssphZhou/poki
          ref: 10c4f80be7761c83004e41b885121953032518e8
          path: source
      - name: Apply public compatibility patch
        working-directory: source
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import base64,pathlib
          pathlib.Path('remote-port.patch').write_bytes(base64.b64decode(''))
          PYCODE
          git apply --check remote-port.patch
          git apply remote-port.patch
          git diff --check
          mkdir -p out
          cp remote-port.patch out/
          git diff > out/modified-source.diff
      - name: Apply upstream audio-only repair
        working-directory: source
        shell: bash
        run: |
          python3 - <<'AUDIOFIX'
          import base64,pathlib
          pathlib.Path('audio-only.patch').write_bytes(base64.b64decode(''))
          AUDIOFIX
          git apply --check audio-only.patch
          git apply audio-only.patch
          git diff --check
          cp audio-only.patch out/
          git diff > out/modified-source.diff
      - name: Backport PR91 cellular startup to the installed source
        working-directory: source
        shell: bash
        run: |
          python3 - <<'CELLULAR'
          import base64,pathlib
          pathlib.Path('cellular-backport.patch').write_bytes(base64.b64decode(''))
          CELLULAR
          git apply --check cellular-backport.patch
          git apply cellular-backport.patch
          git diff --check
          cp cellular-backport.patch out/
          git diff > out/modified-source.diff
      - name: Select latest installed Xcode
        shell: bash
        run: |
          XCODE="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            source/native/launcher/target
          key: poki-port-${{ runner.os }}-${{ hashFiles('source/native/launcher/Cargo.lock') }}
      - name: Test and build launcher
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          native/launcher/fetch-idevice.sh
          rustup update stable --no-self-update
          rustup default stable
          rustup target add aarch64-apple-ios
          cargo test --release --locked --manifest-path native/launcher/Cargo.toml --lib
          cargo build --release --locked --target aarch64-apple-ios --manifest-path native/launcher/Cargo.toml
      - name: Build unsigned external app
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          native/ios-app/scripts/make-assets.sh
          brew install xcodegen
          xcodegen generate --spec native/ios-app/project-external.yml
          VERSION="$(cat native/ios-app/VERSION)"
          BUILD="3101"
          xcodebuild build -project native/ios-app/PokiExternal.xcodeproj -scheme Poki -configuration Release -destination generic/platform=iOS -derivedDataPath build/app-external CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO ARCHS=arm64 MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD" > build-iphone.log 2>&1 || { tail -n 100 build-iphone.log; exit 1; }
          native/ios-app/scripts/package-app.sh build/app-external/Build/Products/Release-iphoneos/Poki.app external out/Poki-external-port-config-unsigned.ipa "$VERSION" "$BUILD"
          (cd out && shasum -a 256 *.ipa > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Poki-cellular-3101-unsigned
          path: |
            source/out/
            source/build-iphone.log
          if-no-files-found: error
          retention-days: 7
